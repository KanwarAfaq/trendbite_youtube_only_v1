name: TrendBite Live Video Bot

on:
  workflow_dispatch:
  schedule:
    # Twice daily. GitHub Actions cron is UTC: 00:15 and 12:15 UTC.
    # Taiwan time: 08:15 and 20:15.
    - cron: "15 0,12 * * *"
  # Guarded push trigger lets us run a verified deployment commit immediately.
  # Normal pushes do NOT execute the bot unless the commit message contains [run-bot].
  push:
    branches:
      - main

concurrency:
  group: trendbite-live-video-bot
  cancel-in-progress: false

jobs:
  post-videos:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

      # Optional. If configured, this is a base64-encoded Netscape cookie file.
      YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
      YTDLP_COOKIE_FILE: youtube_cookies.txt

      FACEBOOK_GRAPH_VERSION: v26.0
      FACEBOOK_PUBLISH_MODE: reel

      DISCOVERY_THEMES: animal|cat|dog|baby|monkey|little boss
      DISCOVERY_QUERIES_PER_ATTEMPT: "6"
      DISCOVERY_RESULTS_PER_QUERY: "25"
      DISCOVERY_MAX_CANDIDATES: "120"
      DISCOVERY_FRESH_DAYS: 7|30|90|365|1825
      DISCOVERY_SLOT_HOURS: "12"

      YOUTUBE_SEARCH_ORDER: date
      YOUTUBE_VIDEO_LICENSE: creativeCommon
      YOUTUBE_REQUIRE_REUSABLE_LICENSE: "true"

      VIDEO_POST_COUNT: "10"
      VIDEO_POST_DELAY_SECONDS: "60"
      VIDEO_MAX_ATTEMPTS: "5"
      DELETE_LOCAL_AFTER_POST: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Deno for yt-dlp YouTube challenges
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify yt-dlp runtime
        run: |
          python -c "import yt_dlp; print('yt-dlp', yt_dlp.version.__version__)"
          deno --version

      - name: Restore YouTube cookies if configured
        shell: bash
        run: |
          if [ -n "${YOUTUBE_COOKIES_B64:-}" ]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > youtube_cookies.txt
            chmod 600 youtube_cookies.txt
            echo "YouTube cookie file restored."
          else
            echo "YOUTUBE_COOKIES_B64 is not configured; continuing without cookies."
          fi

      - name: Preflight
        run: python preflight.py

      - name: Discover and post 10 videos
        run: python video_bot.py --post --count 10
